{% extends "base.html" %}
{% block title %}{{ _(title) }}{% endblock %}
{% block main_class %}page narrow{% endblock %}
{% block content %}
<section class="card center">
  <h1>{{ _(title) }}</h1>
  {% if text %}<p>{{ _(text, **(params or {})) }}</p>{% endif %}
  <p><a class="button secondary" href="{{ url('/') }}">{{ _("Home") }}</a></p>
</section>
{% endblock %}
