<!doctype html>
<html lang="{{ lang }}">
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1d2433;">
  <div style="max-width:640px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #e3e6eb;">
    <div style="padding:16px 24px;border-bottom:4px solid {{ st.accent_color }};">
      {% if has_logo %}<img src="cid:logo" alt="" style="height:48px;vertical-align:middle;margin-right:12px;">{% endif %}
      <span style="vertical-align:middle;">
        {% if st.institution_name %}<span style="display:block;font-size:13px;color:#666;">{{ st.institution_name }}</span>{% endif %}
        <strong style="font-size:18px;">{{ st.app_title }}</strong>
      </span>
    </div>
    <div style="padding:24px;font-size:15px;line-height:1.5;">
      {% block body %}{% endblock %}
    </div>
    <div style="padding:12px 24px;border-top:1px solid #e3e6eb;font-size:12px;color:#888;">{{ copyright }}</div>
  </div>
</body>
</html>
