{% extends "base.html" %}
{% block main_class %}page narrow{% endblock %}
{% block content %}
<section class="card center">
  <h1>You're signed in</h1>
  <p>as <strong>{{ user.name }}</strong> &lt;{{ user.email }}&gt;</p>

  <p class="muted"><a href="{{ url('/profile') }}">Change your name</a></p>
</section>
{% endblock %}
